name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
              - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p FocusVerseAI/FocusVerseAI assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp FocusVerseAI/FocusVerseAI/app/build/outputs/apk/debug/app-debug.apk FocusVerseAI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusVerseAI-apk
          path: FocusVerseAI.apk

      - name: Publish public download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: FocusVerse AI build ${{ github.run_number }}
          body: Download FocusVerseAI.apk below, open it on your Android phone and tap Install.
          files: FocusVerseAI.apk
